# Fichier géré par gdm-dev-rules : ne pas le modifier ici.
#
# Bloque toute PR qui modifie localement un fichier géré par gdm-dev-rules
# (règles IA, docs-rules, design system, workflow sécurité, partie GDM de
# CLAUDE.md / AGENTS.md). Ces fichiers évoluent uniquement
# dans GUY-DEMARLE/gdm-dev-rules et arrivent ici par le robot de synchro.
#
# Indépendant de la stack : fonctionne sur n'importe quelle app.
# À rendre obligatoire dans la protection des branches : « GDM Rules Guard ».

name: GDM Rules Guard

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: GDM Rules Guard
    # Sauté sur une promotion (PR qui part de dev ou staging de ce repo) : ces
    # branches sont protégées, leur contenu est déjà passé par ce contrôle.
    # Sauté aussi sur un push de Dependabot (branche dependabot/…) : sa config,
    # posée par gdm-dev-rules, ne met à jour que des manifestes et lockfiles,
    # jamais un fichier géré. Si quelqu'un d'autre pousse sur la branche, le
    # contrôle revient.
    # Un job sauté compte comme réussi pour les contrôles obligatoires.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      (github.head_ref != 'dev' && github.head_ref != 'staging' &&
      !(startsWith(github.head_ref, 'dependabot/') && github.actor == 'dependabot[bot]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Vérifier les fichiers gérés par gdm-dev-rules
        run: bash .ai-rules/verify-managed.sh
